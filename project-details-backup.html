        // Load project details based on URL parameter
        function loadProjectDetails() {
            const { id } = getUrlParams();
            const project = projects[id];
            
            if (project) {
                // Helper function to check if an array has valid content
                const hasValidContent = (arr) => Array.isArray(arr) && arr.length > 0 && arr.some(item => item && item.trim() !== '');
                
                document.getElementById('projectDetails').innerHTML = `
                    <div class="glass-effect rounded-2xl p-8">
                        ${project.videoUrl ? `
                        <!-- Video Embed -->
                        <div class="aspect-video rounded-xl overflow-hidden mb-8">
                            <iframe src="${project.videoUrl}" 
                                class="w-full h-full"
                                allow="autoplay" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        ` : ''}
                        
                        <h1 class="text-4xl font-bold mb-2">${project.title}</h1>
                        ${project.subtitle ? `<p class="text-xl text-white/60 mb-6">${project.subtitle}</p>` : ''}
                        
                        ${project.description ? `
                        <p class="text-white/80 mb-8">${project.description}</p>
                        ` : ''}

                        <div class="grid md:grid-cols-2 gap-8 mb-8">
                            ${(project.role || project.duration) ? `
                            <div>
                                <h3 class="text-xl font-semibold mb-4">Project Details</h3>
                                <div class="space-y-2 text-white/80">
                                    ${project.role ? `<p><span class="text-white/60">Role:</span> ${project.role}</p>` : ''}
                                    ${project.duration ? `<p><span class="text-white/60">Duration:</span> ${project.duration}</p>` : ''}
                                </div>
                            </div>
                            ` : ''}
                            
                            ${hasValidContent(project.technologies) ? `
                            <div>
                                <h3 class="text-xl font-semibold mb-4">Technologies Used</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${project.technologies.map(tag => `
                                        <span class="px-3 py-1 rounded-full text-sm bg-white/10">${tag}</span>
                                    `).join('')}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="space-y-6 mb-8">
                            ${hasValidContent(project.challenges) ? `
                            <div>
                                <h3 class="text-xl font-semibold mb-2">Challenges</h3>
                                <ul class="list-disc pl-4 text-white/80">
                                    ${project.challenges.map(challenge => `
                                        <li>${challenge}</li>
                                    `).join('')}
                                </ul>
                            </div>
                            ` : ''}

                            ${hasValidContent(project.outcomes) ? `
                            <div>
                                <h3 class="text-xl font-semibold mb-2">Outcomes</h3>
                                <ul class="list-disc pl-4 text-white/80">
                                    ${project.outcomes.map(outcome => `
                                        <li>${outcome}</li>
                                    `).join('')}
                                </ul>
                            </div>
                            ` : ''}
                        </div>
                        
                        ${hasValidContent(project.images) ? `
                        <div>
                            <h3 class="text-xl font-semibold mb-4">Project Gallery</h3>
                            <div class="project-gallery" id="projectGallery">
                                ${project.images.map((image, index) => `
                                    ${image ? `
                                    <div class="gallery-item">
                                        <a 
                                            href="${image}"
                                            data-fancybox="gallery"
                                            class="block w-full h-full">
                                            <img src="${image}" 
                                                 alt="${project.title} - Image ${index + 1}" 
                                                 class="w-full h-full object-cover"
                                                 loading="lazy"
                                                 onerror="console.error('Failed to load:', this.src); this.parentElement.parentElement.style.display='none';"
                                                 onload="console.log('Image loaded:', this.src)">
                                        </a>
                                    </div>
                                    ` : ''}
                                `).join('')}
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;

                // Initialize gallery functionality
                setTimeout(() => {
                    console.log('Initializing gallery...');
                    
                    const galleryItems = document.querySelectorAll('[data-fancybox="gallery"]');
                    console.log('Found gallery items:', galleryItems.length);
                    
                    if (galleryItems.length > 0) {
                        // Method 1: Try Simple Lightbox first (more reliable)
                        if (window.simpleLightbox) {
                            console.log('Using Simple Lightbox');
                            
                            galleryItems.forEach((item, index) => {
                                item.addEventListener('click', function(e) {
                                    e.preventDefault();
                                    console.log('Gallery item clicked:', this.href);
                                    
                                    const allImages = Array.from(galleryItems).map(item => item.href);
                                    window.simpleLightbox.open(allImages, index);
                                });
                            });
                            
                        // Method 2: Fallback to Fancybox
                        } else if (typeof $ !== 'undefined' && $.fancybox) {
                            console.log('Using Fancybox');
                            
                            // Clean initialization
                            $('[data-fancybox="gallery"]').fancybox({
                                buttons: ['zoom', 'slideShow', 'thumbs', 'close'],
                                loop: true,
                                animationEffect: "fade",
                                transitionEffect: "slide"
                            });
                            
                        // Method 3: Manual implementation
                        } else {
                            console.log('Using manual gallery');
                            
                            galleryItems.forEach((item, index) => {
                                item.addEventListener('click', function(e) {
                                    e.preventDefault();
                                    
                                    // Create simple overlay
                                    const overlay = document.createElement('div');
                                    overlay.style.cssText = `
                                        position: fixed;
                                        top: 0;
                                        left: 0;
                                        width: 100%;
                                        height: 100%;
                                        background: rgba(0,0,0,0.9);
                                        z-index: 9999;
                                        display: flex;
                                        align-items: center;
                                        justify-content: center;
                                        cursor: pointer;
                                    `;
                                    
                                    const img = document.createElement('img');
                                    img.src = this.href;
                                    img.style.cssText = `
                                        max-width: 90%;
                                        max-height: 90%;
                                        object-fit: contain;
                                    `;
                                    
                                    overlay.appendChild(img);
                                    document.body.appendChild(overlay);
                                    
                                    overlay.addEventListener('click', () => {
                                        document.body.removeChild(overlay);
                                    });
                                });
                            });
                        }
                        
                        console.log('Gallery initialization complete');
                    }
                }, 1000);
                            
                            // Add backup click handler
                            item.addEventListener('click', function(e) {
                                console.log('Manual click detected on:', this.href);
                                
                                // If Fancybox didn't handle it, use simple lightbox
                                setTimeout(() => {
                                    if (!document.querySelector('.fancybox-container')) {
                                        console.log('Fancybox did not open, using simple lightbox...');
                                        e.preventDefault();
                                        
                                        // Collect all gallery images
                                        const allImages = Array.from(galleryItems).map(item => item.href);
                                        
                                        // Open simple lightbox
                                        if (window.simpleLightbox) {
                                            window.simpleLightbox.open(allImages, index);
                                        } else {
                                            // Ultimate fallback - open in new tab
                                            window.open(this.href, '_blank');
                                        }
                                    }
                                }, 100);
                            });
                            
                            // Also add direct click handler as immediate fallback
                            item.addEventListener('click', function(e) {
                                // Wait a bit to see if Fancybox handles it
                                setTimeout(() => {
                                    // If no Fancybox modal is visible, use simple lightbox
                                    if (!document.querySelector('.fancybox-slide') && 
                                        !document.querySelector('.fancybox-container')) {
                                        
                                        console.log('Using simple lightbox fallback immediately');
                                        const allImages = Array.from(document.querySelectorAll('[data-fancybox="gallery"]'))
            }
        }

        // Load project details when page loads
        window.addEventListener('DOMContentLoaded', loadProjectDetails);
        
        // Additional fallback initialization
        window.addEventListener('load', () => {
            // Double-check Fancybox initialization
            setTimeout(() => {
                const galleryItems = document.querySelectorAll('[data-fancybox="gallery"]');
                if (galleryItems.length > 0 && typeof $ !== 'undefined' && $.fancybox) {
                    console.log('Fallback: Re-initializing jQuery Fancybox for', galleryItems.length, 'items');
                    
                    // Force destroy and re-init
                    try {
                        $.fancybox.destroy();
                    } catch (e) {
                        // Ignore error
                    }
                    
                    // Super simple initialization
                    $('[data-fancybox="gallery"]').fancybox();
                    
                    console.log('Fallback jQuery Fancybox initialization complete');
                    
                    // Test one item manually
                    if (galleryItems.length > 0) {
                        const firstItem = galleryItems[0];
                        console.log('Testing first gallery item:', firstItem.href);
                        
                        // Add a test button temporarily (for debugging)
                        const testBtn = document.createElement('button');
                        testBtn.textContent = 'Test Gallery';
                        testBtn.style.position = 'fixed';
                        testBtn.style.top = '100px';
                        testBtn.style.right = '20px';
                        testBtn.style.zIndex = '9999';
                        testBtn.style.background = 'red';
                        testBtn.style.color = 'white';
                        testBtn.style.padding = '10px';
                        testBtn.onclick = () => {
                            console.log('Manual test button clicked');
                            $.fancybox.open({
                                src: firstItem.href,
                                type: 'image'
                            });
                        };
                        document.body.appendChild(testBtn);
                        
                        // Remove test button after 5 seconds
                        setTimeout(() => {
                            if (testBtn.parentNode) {
                                testBtn.remove();
                            }
                        }, 5000);
                    }
                } else {
                    console.log('Fallback check - jQuery:', typeof $ !== 'undefined');
                    console.log('Fallback check - Fancybox:', typeof $.fancybox !== 'undefined');
                }
            }, 2000);
        });
    </script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js"></script>
